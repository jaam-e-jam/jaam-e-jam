descriptions:
  - from: "518 BCE"
    to: "330 BCE"
    markdown:
      en: "Pārsa, often called Persepolis in English, was an Achaemenid royal centre. Darius I began its monumental terrace around 518 BCE."
      pes: "پارسه، که در انگلیسی بیشتر با نام پرسپولیس شناخته می‌شود، مرکزی شاهی در دورهٔ هخامنشی بود. داریوش یکم ساخت مجموعهٔ باشکوه آن را حدود ۵۱۸ پیش از میلاد آغاز کرد."
    sources: [unesco, iranica]
sources:
