      en: "Babylon was a major Mesopotamian city associated with Hammurabi and later the Neo-Babylonian kings. It was their capital from 626 to 539 BCE."
      pes: "بابل شهری بزرگ در بین‌النهرین بود که با حمورابی و سپس شاهان نو بابلی پیوند داشت. از ۶۲۶ تا ۵۳۹ پیش از میلاد پایتخت آنان بود."
    sources: [unesco]
